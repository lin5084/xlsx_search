name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持手动触发编译

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Tidy & download dependencies
        run: |
          go mod tidy
          go mod download

      - name: Build exe (strip symbol)
        run: go build -ldflags="-s -w" -o xlsx_search.exe main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xlsx_search-windows-amd64
          path: xlsx_search.exe
